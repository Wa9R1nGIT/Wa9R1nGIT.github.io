<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>菅原慶太のポートフォリオ</title>
    <meta name="description" content="Unity WebGL 作品ポートフォリオ" />
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171923;
            --panel-2: #1e2230;
            --text: #e5e7eb;
            --muted: #9aa3b2;
            --accent: #7c9cff;
            --accent-2: #9f7aea;
            --border: #2a2f3e;
            --radius: 14px;
            --shadow: 0 8px 30px rgba(0,0,0,.25);
            --maxw: 1100px;
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Sans","Noto Sans JP",Arial,sans-serif;
            background: linear-gradient(180deg,#0c0f14,#0f1115 40%,#0f1115);
            color: var(--text);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: saturate(180%) blur(10px);
            background: linear-gradient(180deg,rgba(12,15,20,.9),rgba(12,15,20,.6));
            border-bottom: 1px solid var(--border);
        }

        .bar {
            max-width: var(--maxw);
            margin: auto;
            padding: 14px 18px;
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: .2px;
        }

            .brand .dot {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: conic-gradient(from 0deg,var(--accent),var(--accent-2));
                box-shadow: 0 0 20px rgba(124,156,255,.6);
            }

            .brand span {
                font-size: 1.05rem
            }

        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: .95rem;
            margin-left: 16px
        }

            nav a:hover {
                color: var(--text)
            }

        .hero {
            max-width: var(--maxw);
            margin: 24px auto 10px;
            padding: 0 18px 6px;
        }

            .hero h1 {
                font-size: clamp(1.6rem,2.6vw,2.2rem);
                margin: 8px 0;
                background: linear-gradient(90deg,var(--text),#bcd0ff 40%,#d7c7ff 70%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .hero p {
                margin: 6px 0 0;
                color: var(--muted)
            }

        .grid {
            max-width: var(--maxw);
            margin: 20px auto 60px;
            padding: 0 18px;
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
        }

        .card {
            background: linear-gradient(180deg,var(--panel),var(--panel-2));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 240px;
        }

        .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #0b0d12 center/cover no-repeat;
            border-bottom: 1px solid var(--border);
        }

        .body {
            padding: 14px 14px 6px
        }

        .title {
            font-weight: 700;
            margin: 4px 0 4px
        }

        .desc {
            color: var(--muted);
            font-size: .95rem;
            line-height: 1.6
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0 6px
        }

        .tag {
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 999px;
            font-size: .8rem;
            color: #c6d3ff;
            background: rgba(124,156,255,.08)
        }

        .actions {
            display: flex;
            gap: 10px;
            padding: 12px 14px 16px
        }

        button {
            appearance: none;
            border: none;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: .2px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: .95rem;
        }

        .primary {
            background: linear-gradient(90deg,var(--accent),var(--accent-2));
            color: #0b0d12;
            border: 1px solid rgba(255,255,255,.12);
        }

        footer {
            max-width: var(--maxw);
            margin: 10px auto 40px;
            padding: 0 18px;
            color: var(--muted);
            font-size: .95rem;
            display: grid;
            gap: 12px;
        }

        .about, .contact {
            background: linear-gradient(180deg,var(--panel),var(--panel-2));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .mono {
            font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
            font-size: .9rem;
            color: #cbd5e1
        }

        .note {
            font-size: .85rem;
            color: #94a3b8
        }
    </style>
</head>
<body>
    <header>
        <div class="bar">
            <div class="brand">
                <div class="dot" aria-hidden="true"></div>
                <span>菅原慶太のポートフォリオ</span>
            </div>
            <nav>
                <a href="#works">作品</a>
                <a href="#about">プロフィール</a>
                <a href="#contact">連絡先</a>
            </nav>
        </div>
    </header>

    <section class="hero" id="top">
        <h1>Unity WebGL 作品集</h1>
        <p>ここでは Unity で制作したゲームをブラウザ上で直接遊べます。Play ボタンで新しいタブが開きます。</p>
    </section>

    <section class="grid" id="works">
        <!-- プロジェクト 1 -->
        <article class="card" data-project="rhythm">
            <div class="thumb" style="background-image:url('thumbs/RhythmG.png');"></div>
            <div class="body">
                <div class="title">Rhythm Game</div>
                <p class="desc">画面上に丸いリングが出てくるのでそれに AIM を合わせ、タイミングよく Z / X キーでスコアを稼ぐゲームです。</p>
                <div class="tags">
                    <span class="tag">Unity</span><span class="tag">C#</span>
                </div>
            </div>
            <div class="actions">
                <button class="primary playBtn" data-src="RhythmGameWebGL/index.html">Play</button>
            </div>
        </article>

        <!-- プロジェクト 2 -->
        <article class="card" data-project="escape">
            <div class="thumb" style="background-image:url('thumbs/EscapeG.png');"></div>
            <div class="body">
                <div class="title">Escape Game</div>
                <p class="desc">ドアが置かれた謎の部屋から脱出するゲーム。WASD で移動、E でインタラクト。</p>
                <div class="tags">
                    <span class="tag">Unity</span><span class="tag">C#</span>
                </div>
            </div>
            <div class="actions">
                <button class="primary playBtn" data-src="EscapeGameWebGL/index.html">Play</button>
            </div>
        </article>
    </section>

    <section class="grid">
        <div class="about" id="about">
            <h2 style="margin:4px 0 10px">プロフィール</h2>
            <p>東京デザインテクノロジーセンター専門学校 在学。</p>
        </div>
        <div class="contact" id="contact">
            <h2 style="margin:4px 0 10px">連絡先</h2>
            <p><!-- 連絡先 --></p>
        </div>
    </section>

    <footer>
        <div class="note">© <span id="year"></span> 菅原慶太</div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Play → 新規タブで開く
        document.querySelectorAll('.playBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                const url = btn.getAttribute('data-src');
                if (!url) return;
                window.open(url, '_blank', 'noopener'); // 新しいタブで開く
            });
        });
    </script>
</body>
</html>
